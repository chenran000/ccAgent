<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TestAssistant AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230ea5e9'/><stop offset='1' stop-color='%231e40af'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><path d='M22 16h-6v32h6' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round' opacity='.55'/><path d='M42 16h6v32h-6' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round' opacity='.55'/><path d='M14 32h9l4-9 6 14 4-9h11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <style>
    body {
      margin: 0;
      background-color: #f5f5f5;
    }
    #loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 10px;
      background-color: #f5f5f5;
    }
    .loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #3b82f6;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading-screen">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
